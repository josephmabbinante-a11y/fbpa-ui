apiVersion: v1
kind: Config
clusters:
- name: fbpa-cluster
  cluster:
    server: https://your-k8s-api-server-url
    certificate-authority-data: <base64-encoded-ca-cert>
users:
- name: fbpa-user
  user:
    token: <your-access-token>
contexts:
- name: fbpa-context
  context:
    cluster: fbpa-cluster
    user: fbpa-user
current-context: fbpa-context
