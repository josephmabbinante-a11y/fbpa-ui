version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight
      POSTGRES_DB: freightdb
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend

  api:
    build: ./api
    ports:
      - "5000:5000"
    env_file:
      - ./api/.env
    depends_on:
      - postgres

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis

  route-intelligence-service:
    build: ./backend/route-intelligence-service
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://freight:freight@postgres:5432/freightdb
      REDIS_URL: redis://redis:6379

  pricing-service:
    build: ./backend/pricing-service
    depends_on:
      - route-intelligence-service

  ml-shadow-service:
    build: ./backend/ml-shadow-service
    ports:
      - "8000:8000"

  tracking-service:
    build: ./backend/tracking-service
    depends_on:
      - route-intelligence-service

  capacity-worker:
    build: ./backend/capacity-worker
    depends_on:
      - postgres
