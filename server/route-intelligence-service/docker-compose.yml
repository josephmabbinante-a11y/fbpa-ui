version: '3.9'

services:
  route-intelligence-service:
    build: .
    container_name: route-intelligence-service
    ports:
      - "4010:4010"
    environment:
      NODE_ENV: production
      PORT: 4010
      HERE_API_KEY: ${HERE_API_KEY}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/route_intelligence
      ROUTE_CACHE_TTL_SECONDS: 86400
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 120
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: route-intelligence-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: route-intelligence-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: route_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
