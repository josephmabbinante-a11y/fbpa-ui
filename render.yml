# ⚠️ SECURITY WARNING:
# The MongoDB credentials that were previously in this file have been exposed publicly.
# These credentials MUST be rotated immediately in MongoDB Atlas.
# DO NOT commit credentials to this file - use Render's environment variable dashboard instead.

services:
  # Backend API Service
  - type: web
    name: fbpa-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard - DO NOT hardcode credentials
      - key: JWT_SECRET
        sync: false  # Set this in Render dashboard - use a strong random secret
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false  # Set this in Render dashboard to your frontend URL (e.g., https://your-app.onrender.com)
      - key: SERVE_STATIC
        value: "true"
        sync: false  # Set in dashboard
        value: mongodb+srv://Vercel-Admin-FBPA-Platform:RXKnQPyNad7lOFkF@fbpa-platform.rut6g2t.mongodb.net/?retryWrites=true&w=majority
      - key: JWT_SECRET
        sync: false  # Set in dashboard
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false  # Set in dashboard
      - key: SERVE_STATIC
        value: "false"  # Backend doesn't serve static in this setup

  # Frontend Static Site
  - type: web
    name: fbpa-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to backend URL in dashboard
