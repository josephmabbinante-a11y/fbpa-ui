services:
  # Backend API Service
  - type: web
    name: fbpa-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: MONGODB_URI
        sync: false  # Set in dashboard
        value: mongodb+srv://Vercel-Admin-FBPA-Platform:RXKnQPyNad7lOFkF@fbpa-platform.rut6g2t.mongodb.net/?retryWrites=true&w=majority
      - key: JWT_SECRET
        sync: false  # Set in dashboard
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false  # Set in dashboard
      - key: SERVE_STATIC
        value: "false"  # Backend doesn't serve static in this setup

  # Frontend Static Site
  - type: web
    name: fbpa-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to backend URL in dashboard
