# ⚠️ SECURITY WARNING:
# DO NOT commit credentials to this file - use Render's environment variable dashboard instead.

services:
  # Backend API Service
  - type: web
    name: fbpa-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard - DO NOT hardcode credentials
      - key: JWT_SECRET
        sync: false  # Set this in Render dashboard - use a strong random secret
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false  # Set this in Render dashboard to your frontend URL (e.g., https://hdhtransport.com)
      - key: SERVE_STATIC
        value: "false"

  # Frontend Static Site
  - type: web
    name: fbpa-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to backend URL in dashboard
