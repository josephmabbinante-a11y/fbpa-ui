# ⚠️ SECURITY WARNING:
# The MongoDB credentials that were previously in this file have been exposed publicly.
# These credentials MUST be rotated immediately in MongoDB Atlas.
# DO NOT commit credentials to this file - use Render's environment variable dashboard instead.

services:
  - type: web
    name: fbpa-backend
    environment: node
    startCommand: node server/index.js
    buildCommand: npm install
    envVars:
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard - DO NOT hardcode credentials
      - key: JWT_SECRET
        sync: false  # Set this in Render dashboard - use a strong random secret
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false  # Set this in Render dashboard to your frontend URL (e.g., https://your-app.onrender.com)
      - key: SERVE_STATIC
        value: "true"
